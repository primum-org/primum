name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # For the page's JavaScript tests (`just test-js`) and the web UI (`just ui-check`).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/webui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/webui/pnpm-lock.yaml

      - name: Install
        run: |
          uv sync --locked
          uv run just ui-install

      # The same command contributors run: lint, types, architecture, generated files, tests.
      - name: just check
        run: uv run just check
