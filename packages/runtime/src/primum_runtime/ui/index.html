<!doctype html>
<!-- Every visible text comes from the catalogs (data-i18n keys); none is written here. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="generated/logo/primum-mark-16-light.svg" type="image/svg+xml"
        media="(prefers-color-scheme: light)">
  <link rel="icon" href="generated/logo/primum-mark-16-dark.svg" type="image/svg+xml"
        media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="generated/tokens.css">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body class="touch">
  <header class="bar">
    <span class="icon icon-logo" aria-hidden="true"></span>
    <h1 data-i18n="app.title"></h1>
  </header>

  <main>
    <p id="connection" class="notice notice-warning" role="status" hidden>
      <span class="icon icon-warn" aria-hidden="true"></span>
      <span class="notice-text" data-i18n="connection.offline"></span>
    </p>

    <section id="panic-active" class="notice notice-danger" role="alert" hidden>
      <span class="icon icon-panic" aria-hidden="true"></span>
      <div class="notice-text">
        <p data-i18n="panic.active"></p>
        <button id="release-panic" class="button" type="button" data-i18n="panic.release"></button>
      </div>
    </section>

    <section id="error" class="notice notice-danger" role="alert" hidden>
      <span class="icon icon-warn" aria-hidden="true"></span>
      <div class="notice-text">
        <p id="error-message"></p>
        <p id="error-hint" class="secondary"></p>
        <details id="error-technical" hidden>
          <summary data-i18n="error.detail"></summary>
          <pre id="error-technical-text"></pre>
        </details>
        <button id="error-close" class="button" type="button" data-i18n="error.close"></button>
      </div>
    </section>

    <section id="pairing" class="pairing" aria-labelledby="pairing-heading" hidden>
      <h2 id="pairing-heading" data-i18n="pairing.heading"></h2>
      <p class="secondary" data-i18n="pairing.explain"></p>
      <form id="pairing-form">
        <label for="pairing-code" data-i18n="pairing.code"></label>
        <input id="pairing-code" class="pairing-code" type="text" inputmode="numeric"
               autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" required>
        <label for="pairing-name" data-i18n="pairing.name"></label>
        <input id="pairing-name" class="pairing-name" type="text" maxlength="64">
        <button class="button" type="submit" data-i18n="pairing.submit"></button>
      </form>
    </section>

    <section class="outputs" aria-labelledby="outputs-heading">
      <h2 id="outputs-heading" data-i18n="outputs.heading"></h2>
      <ul id="outputs"></ul>
    </section>

    <section id="sequences-section" class="outputs" aria-labelledby="sequences-heading" hidden>
      <h2 id="sequences-heading" data-i18n="sequences.heading"></h2>
      <ul id="sequences"></ul>
    </section>

    <section id="inputs-section" class="outputs" aria-labelledby="inputs-heading" hidden>
      <h2 id="inputs-heading" data-i18n="inputs.heading"></h2>
      <ul id="inputs"></ul>
    </section>
  </main>

  <footer class="panic-area">
    <button id="panic" class="panic" type="button" aria-describedby="panic-description">
      <span class="icon icon-panic" aria-hidden="true"></span>
      <span data-i18n="panic.button"></span>
    </button>
    <p id="panic-description" class="secondary" data-i18n="panic.description"></p>
  </footer>

  <template id="output-row">
    <li class="output">
      <span class="icon icon-led" aria-hidden="true"></span>
      <span class="output-name"></span>
      <button class="switch" type="button" aria-pressed="false">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-state"></span>
      </button>
      <button class="button test" type="button"></button>
      <button class="button release" type="button" hidden></button>
      <p class="testing secondary" role="timer" hidden></p>
      <p class="controlled-by secondary" role="status" hidden></p>
      <div class="level" hidden>
        <input class="level-slider" type="range" min="0" max="100" step="1">
        <output class="level-value"></output>
      </div>
    </li>
  </template>

  <template id="sequence-row">
    <li class="output">
      <span class="icon icon-sequence" aria-hidden="true"></span>
      <span class="output-name"></span>
      <span class="input-state" role="status"></span>
      <button class="button start" type="button"></button>
      <button class="button stop" type="button"></button>
    </li>
  </template>

  <template id="input-row">
    <li class="output">
      <span class="icon icon-button" aria-hidden="true"></span>
      <span class="output-name"></span>
      <span class="input-state" role="status"></span>
    </li>
  </template>
</body>
</html>
