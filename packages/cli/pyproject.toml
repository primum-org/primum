[project]
name = "primum-cli"
dynamic = ["version"]
description = "Primum's command line: validate a project folder, without hardware."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["primum-core"]

[project.scripts]
primum = "primum_cli.main:main"

[tool.uv.sources]
primum-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/primum_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/primum_cli"]
